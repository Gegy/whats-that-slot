plugins {
  id 'net.neoforged.moddev' version '2.0.74' apply false
  id 'fabric-loom' version '1.10-SNAPSHOT' apply false
  id 'org.jetbrains.gradle.plugin.idea-ext' version '1.1.7'
}

tasks.register('generateModManifests') {
  final def expandProps = [
          'version'                      : mod_version,
          'group'                        : project.group,
          'minecraft_version'            : minecraft_version,
          'minecraft_version_range'      : minecraft_version_range,
          'fabric_version'               : fabric_version,
          'fabric_loader_version'        : fabric_loader_version,
          'mod_name'                     : mod_name,
          'mod_author'                   : mod_author,
          'mod_id'                       : mod_id,
          'license'                      : license,
          'description'                  : project.description,
          'neoforge_version'             : neoforge_version,
          'neoforge_loader_version_range': neoforge_loader_version_range,
          'credits'                      : credits,
          'sources'                      : sources,
          'issue_tracker'                : issue_tracker,
  ]

  inputs.properties expandProps

  final def templateFiles = fileTree('.').matching {
    include '**/*.template'
  }.files

  templateFiles.each { templateFile ->
    final def targetFile = new File(templateFile.parentFile, templateFile.name.substring(0, templateFile.name.length() - '.template'.length()))
    inputs.file templateFile
    outputs.file targetFile
    doLast {
      copy {
        from templateFile
        into targetFile.parentFile
        rename { targetFile.name }
        expand expandProps
      }
    }
  }
}

subprojects {
  apply plugin: 'java-library'

  group = maven_group
  version = "$mod_version+$minecraft_version" + (release ? "" : "-beta")

  java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
  }

  repositories {
    mavenCentral()
    maven {
      url = 'https://repo.spongepowered.org/repository/maven-public/'
      content { includeGroup 'org.spongepowered' }
    }
    maven {
      url = 'https://maven.parchmentmc.org/'
      content { includeGroup 'org.parchmentmc.data' }
    }
  }

  jar {
    from(rootProject.file('LICENSE')) {
      rename { "${it}_${mod_id}" }
    }
  }

  tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 21
  }

  tasks.withType(ProcessResources).configureEach {
    dependsOn generateModManifests
    exclude '**/*.template'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
  }

  tasks.withType(Jar).configureEach {
    dependsOn generateModManifests
  }

  tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
  }
}

idea {
  module {
    downloadSources = true
    downloadJavadoc = true
  }
}
